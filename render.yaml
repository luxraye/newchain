# Bloodchain – Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Services:
#   1. bloodchain-api     – Express API server (Node 24) + Postgres
#   2. bloodchain-demo    – Public demo website (Vite static site)
#   3. bloodchain-pitch   – Investor pitch deck (Vite static site)
#   4. bloodchain-crucible – Internal ops dashboard (Vite static site)
#   5. bloodchain-pulse   – Donor-facing web app (Vite static site)
#   6. bloodchain-sanctum – Admin portal (Vite static site)
#   7. bloodchain-vigil   – Monitoring dashboard (Vite static site)
#
# pulse-mobile is an Expo/React Native app – built & distributed via EAS, not Render.
# mockup-sandbox is a dev-only tool – not deployed.

databases:
  - name: bloodchain-db
    databaseName: bloodchain
    user: bloodchain
    plan: free
    region: oregon

envVarGroups:
  - name: bloodchain-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: PNPM_VERSION
        value: "9.15.4"

services:
  # ── API Server ──────────────────────────────────────────────────────────────
  - type: web
    name: bloodchain-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/health
    envVars:
      - fromGroup: bloodchain-shared
      - key: DATABASE_URL
        fromDatabase:
          name: bloodchain-db
          property: connectionString
      - key: PORT
        value: "10000"
    buildFilter:
      paths:
        - artifacts/api-server/**
        - lib/db/**
        - lib/api-zod/**
        - pnpm-workspace.yaml
        - package.json

  # ── Demo Website (priority deploy) ─────────────────────────────────────────
  - type: web
    name: bloodchain-demo
    runtime: static
    rootDir: .
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ pnpm --filter @workspace/demo run build
    staticPublishPath: artifacts/demo/dist/public
    envVars:
      - fromGroup: bloodchain-shared
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - artifacts/demo/**
        - lib/api-client-react/**
        - pnpm-workspace.yaml

  # ── Investor Pitch Deck ─────────────────────────────────────────────────────
  - type: web
    name: bloodchain-pitch
    runtime: static
    rootDir: .
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ pnpm --filter @workspace/bloodchain-pitch run build
    staticPublishPath: artifacts/bloodchain-pitch/dist/public
    envVars:
      - fromGroup: bloodchain-shared
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - artifacts/bloodchain-pitch/**
        - pnpm-workspace.yaml

  # ── Crucible (Internal Ops) ──────────────────────────────────────────────────
  - type: web
    name: bloodchain-crucible
    runtime: static
    rootDir: .
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ pnpm --filter @workspace/crucible run build
    staticPublishPath: artifacts/crucible/dist/public
    envVars:
      - fromGroup: bloodchain-shared
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - artifacts/crucible/**
        - lib/api-client-react/**
        - pnpm-workspace.yaml

  # ── Pulse (Donor Web App) ───────────────────────────────────────────────────
  - type: web
    name: bloodchain-pulse
    runtime: static
    rootDir: .
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ pnpm --filter @workspace/pulse run build
    staticPublishPath: artifacts/pulse/dist/public
    envVars:
      - fromGroup: bloodchain-shared
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - artifacts/pulse/**
        - lib/api-client-react/**
        - pnpm-workspace.yaml

  # ── Sanctum (Admin Portal) ──────────────────────────────────────────────────
  - type: web
    name: bloodchain-sanctum
    runtime: static
    rootDir: .
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ pnpm --filter @workspace/sanctum run build
    staticPublishPath: artifacts/sanctum/dist/public
    envVars:
      - fromGroup: bloodchain-shared
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - artifacts/sanctum/**
        - lib/api-client-react/**
        - pnpm-workspace.yaml

  # ── Vigil (Monitoring Dashboard) ────────────────────────────────────────────
  - type: web
    name: bloodchain-vigil
    runtime: static
    rootDir: .
    buildCommand: >-
      pnpm install --frozen-lockfile &&
